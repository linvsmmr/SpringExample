<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Thymeleaf 날짜, 문자열 다루기</title>
</head>
<body>
    <h2>Thymeleaf 날짜, 문자열 다루기</h2>
    <h3>1. 날짜 시간 객체</h3>
    <h4 th:text="|Date : ${date}|"></h4>
    <h4 th:text="|LocalDate : ${localDate}|"></h4>
    <h4 th:text="|LocalDateTime : ${localDateTime}|"></h4>

    <h4 th:text="|Date : ${#dates.format(date,'yyyy-MM-dd hh:mm:ss')}|">2025-05-25 16:45:22</h4>
    <h4 th:text="|LocalDate : ${#temporals.format(localDate,'yyyy년 mm월 dd일')}|"></h4>
    <h4 th:text="|LocalDateTime : ${#temporals.format(localDateTime, 'yyyy년 M월 d일 h시 m분 s초')}|"></h4>

    <h3>2. 문자열 다루기</h3>
    <div th:with="string1 = 'No Pain No Gain'">
        <h4 th:text="|문자열 길이 : ${#strings.length(string1)}|"></h4>
        <h4 th:text="|No가 존재하는지 : ${#strings.contains(string1, 'No')}|"></h4>
        <h4 th:if="${#strings.startsWith(string1,'No')}">No로 시작한다</h4>
        <h4 th:if="${#strings.endsWith(string1,'Gain')}">gain 으로 끝난다</h4>
    </div>

    <div th:with="string2 = 'I Love Chicken'">
        <h4 th:text="${#strings.replace(string2,'Chicken','Pizza')}"></h4>
        <h4 th:text="${#strings.substring(string2,2,6)}"></h4>

        <h4 th:text="|첫번째 단어 : ${#strings.arraySplit(string2,' ')[0]}|"></h4>
        <h4 th:text="|두번째 단어 : ${#strings.arraySplit(string2,' ')[1]}|"></h4>
    </div>

    <div th:with="string3 = '                         hello                          '">
        <h4 th:text="${#strings.trim(string3)}"></h4>
    </div>



</body>
</html>
